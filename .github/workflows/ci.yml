name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Build and Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Restore backend
        run: |
          dotnet restore uis-bachelor-sustainability-webapp.csproj
          dotnet restore tests/uis-bachelor-sustainability-webapp.Tests/uis-bachelor-sustainability-webapp.Tests.csproj

      - name: Build backend
        run: dotnet build uis-bachelor-sustainability-webapp.csproj --configuration Release --no-restore

      - name: Build backend tests
        run: dotnet build tests/uis-bachelor-sustainability-webapp.Tests/uis-bachelor-sustainability-webapp.Tests.csproj --configuration Release --no-restore

      - name: Run backend tests
        run: dotnet test tests/uis-bachelor-sustainability-webapp.Tests/uis-bachelor-sustainability-webapp.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory tests/uis-bachelor-sustainability-webapp.Tests/TestResults --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: tests/uis-bachelor-sustainability-webapp.Tests/TestResults/**
          retention-days: 30

  frontend:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Transparent

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Transparent/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: Transparent/dist
          retention-days: 30
